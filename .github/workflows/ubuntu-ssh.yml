name: ubuntu-ssh

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: ubuntu-ssh ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ["24.04", "22.04"]
    env:
      IMAGE: docker.io/fluencelabs/ubuntu-ssh
      LOCAL: gpu-images-probe/ubuntu-ssh:${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          docker build --platform linux/amd64 \
            --build-arg UBUNTU_VERSION=${{ matrix.version }} \
            -t "$LOCAL" ubuntu-ssh

      - name: Probe
        run: scripts/probe.sh "$LOCAL"

      - name: Check Docker Hub credentials
        id: creds
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set; built and probed, not published."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish
        if: steps.creds.outputs.present == 'true'
        run: |
          dated="${{ matrix.version }}-$(date -u +%Y%m%d)"
          for tag in "${{ matrix.version }}" "$dated"; do
            docker tag "$LOCAL" "$IMAGE:$tag"
            docker push -q "$IMAGE:$tag"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$dated")
          {
            echo "### $IMAGE:${{ matrix.version }}"
            echo
            echo "Tags: \`${{ matrix.version }}\`, \`$dated\`"
            echo
            echo "\`$IMAGE:${{ matrix.version }}@${digest#*@}\`"
          } >> "$GITHUB_STEP_SUMMARY"
