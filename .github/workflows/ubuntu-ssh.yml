name: ubuntu-ssh

on:
  pull_request:
    paths:
      - "shared/**"
      - "scripts/probe.sh"
      - "ubuntu-ssh/**"
      - ".github/workflows/_image.yml"
      - ".github/workflows/ubuntu-ssh.yml"
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "scripts/probe.sh"
      - "ubuntu-ssh/**"
      - ".github/workflows/_image.yml"
      - ".github/workflows/ubuntu-ssh.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        version: ["24.04", "22.04"]
    uses: ./.github/workflows/_image.yml
    with:
      image_name: ubuntu-ssh
      tag: ${{ matrix.version }}
      dockerfile: ubuntu-ssh/Dockerfile
      build_args: UBUNTU_VERSION=${{ matrix.version }}
    secrets: inherit
