name: build-and-publish-image

on:
  workflow_call:
    inputs:
      image_name:
        description: Image repository name under fluencelabs (e.g. ubuntu-ssh)
        required: true
        type: string
      tag:
        description: Floating version tag (e.g. 24.04 or 12.8-ubuntu24.04)
        required: true
        type: string
      dockerfile:
        description: Path to Dockerfile relative to repo root
        required: true
        type: string
      build_args:
        description: Newline-separated KEY=VALUE build arguments
        required: false
        default: ""
        type: string
      probe_script:
        description: Optional extra image-specific probe script
        required: false
        default: ""
        type: string
      free_disk:
        description: Free runner disk space before building large GPU images
        required: false
        default: false
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  build:
    name: ${{ inputs.image_name }}:${{ inputs.tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      GHCR_IMAGE: ghcr.io/fluencelabs/${{ inputs.image_name }}
      DOCKERHUB_IMAGE: docker.io/fluencelabs/${{ inputs.image_name }}
      LOCAL: gpu-images-probe/${{ inputs.image_name }}:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for large GPU image
        if: inputs.free_disk
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/graalvm \
            /usr/share/swift
          docker system prune -af >/dev/null 2>&1 || true
          df -h

      - name: Build
        env:
          BUILD_ARGS_RAW: ${{ inputs.build_args }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          while IFS= read -r line; do
            [ -n "$line" ] && args+=(--build-arg "$line")
          done <<< "$BUILD_ARGS_RAW"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--pull --no-cache)
          fi
          docker build --platform linux/amd64 \
            -f "${{ inputs.dockerfile }}" \
            "${args[@]}" \
            -t "$LOCAL" .

      - name: Probe SSH contract
        run: scripts/probe.sh "$LOCAL"

      - name: Probe image workload
        if: inputs.probe_script != ''
        run: ${{ inputs.probe_script }} "$LOCAL"

      - name: Scan image for HIGH/CRITICAL CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL }}
          scanners: vuln
          timeout: 15m
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Summarize Trivy CVE scan
        if: always()
        run: |
          if [ -f trivy-results.sarif ]; then
            count=$(python3 -c "import json; d=json.load(open('trivy-results.sarif')); print(sum(len(r.get('results',[])) for r in d.get('runs',[])))")
            echo "Trivy fixable HIGH/CRITICAL findings for \`${{ inputs.image_name }}:${{ inputs.tag }}\`: **$count**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Trivy SARIF to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # codeql-bundle-v2.27.6
        with:
          sarif_file: trivy-results.sarif
          category: ${{ inputs.image_name }}-${{ inputs.tag }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        if: github.event_name != 'pull_request'
        run: |
          dated="${{ inputs.tag }}-$(date -u +%Y%m%d)"
          for tag in "${{ inputs.tag }}" "$dated"; do
            docker tag "$LOCAL" "$GHCR_IMAGE:$tag"
            docker push -q "$GHCR_IMAGE:$tag"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$GHCR_IMAGE:$dated")
          {
            echo "### $GHCR_IMAGE:${{ inputs.tag }}"
            echo
            echo "Tags: \`${{ inputs.tag }}\`, \`$dated\`"
            echo
            echo "\`$GHCR_IMAGE:${{ inputs.tag }}@${digest#*@}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Docker Hub credentials
        id: dockerhub
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set; published to GHCR only."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.present == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror to Docker Hub
        if: steps.dockerhub.outputs.present == 'true'
        run: |
          dated="${{ inputs.tag }}-$(date -u +%Y%m%d)"
          for tag in "${{ inputs.tag }}" "$dated"; do
            docker tag "$LOCAL" "$DOCKERHUB_IMAGE:$tag"
            docker push -q "$DOCKERHUB_IMAGE:$tag"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$DOCKERHUB_IMAGE:$dated")
          {
            echo "Mirror: \`$DOCKERHUB_IMAGE:${{ inputs.tag }}@${digest#*@}\`"
          } >> "$GITHUB_STEP_SUMMARY"
